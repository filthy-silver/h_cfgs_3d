<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Tablero Kanban · CFGS 3D</title>

  <link rel="manifest" href="manifest.json" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <link rel="apple-touch-icon" href="icon-192.png" />
  <link rel="icon" type="image/png" sizes="192x192" href="icon-192.png" />

  <link rel="stylesheet" href="css/kanban.css" />
</head>
<body>

<div class="kanban-container">

  <!-- Navegación y Cabecera Superior -->
  <header class="kanban-topbar">
    <div class="topbar-nav">
      <a href="index.html" class="btn-back-nav" title="Volver a la vista del horario">
        <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true">
          <path fill="currentColor" d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/>
        </svg>
        <span>← Volver al Horario</span>
      </a>

      <div class="title-group">
        <h1>Tablero Kanban</h1>
        <p>Entregas de Aules, exámenes oficiales y tareas personales</p>
      </div>
    </div>

    <div class="topbar-actions">
      <!-- Botón para crear tareas del alumno -->
      <button type="button" class="btn-primary-action" id="btn-add-personal-task" aria-haspopup="dialog">
        <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true">
          <path fill="currentColor" d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/>
        </svg>
        <span>+ Tarea personal</span>
      </button>

      <!-- Selector de Modo de Color (Sincronizado con index.html) -->
      <div class="theme-selector" role="group" aria-label="Modo de color">
        <button type="button" class="theme-btn" data-mode="auto">Auto</button>
        <button type="button" class="theme-btn" data-mode="dark">Oscuro</button>
        <button type="button" class="theme-btn" data-mode="light">Claro</button>
      </div>
    </div>
  </header>

  <!-- Barra de Herramientas: Buscador y Leyenda -->
  <section class="kanban-toolbar" aria-label="Herramientas del tablero">
    <div class="search-box-wrapper">
      <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true">
        <path fill="currentColor" d="M15.5 14h-.79l-.28-.27A6.471 6.471 0 0 0 16 9.5 6.5 6.5 0 1 0 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/>
      </svg>
      <input
        type="search"
        id="kanban-search-input"
        class="search-input"
        placeholder="Buscar tarea, examen o módulo…"
        aria-label="Buscar tareas en el tablero"
      />
    </div>

    <div class="board-legend-hints" aria-hidden="true">
      <div class="legend-hint-item">
        <span class="legend-hint-box exam"></span>
        <span>Exámenes (borde 7px)</span>
      </div>
      <div class="legend-hint-item">
        <span class="legend-hint-box aules"></span>
        <span>Aules Moodle</span>
      </div>
      <div class="legend-hint-item">
        <span class="legend-hint-box personal"></span>
        <span>Tareas personales</span>
      </div>
    </div>
  </section>

  <!-- Tablero Kanban de 3 Columnas Fijas -->
  <main class="kanban-board-grid" aria-label="Tablero de tareas">
    
    <!-- Columna 1: Pendiente -->
    <section class="kanban-column" id="column-pending" data-column="pending" aria-label="Columna de tareas pendientes">
      <header class="column-header">
        <div class="column-title-box">
          <span class="col-status-dot pending" aria-hidden="true"></span>
          <h2>Pendiente</h2>
        </div>
        <span class="column-counter-badge" id="count-pending" aria-label="Número de tareas pendientes">0</span>
      </header>
      <div class="column-cards-list" role="list"></div>
    </section>

    <!-- Columna 2: Trabajando -->
    <section class="kanban-column" id="column-in-progress" data-column="in-progress" aria-label="Columna de tareas en curso">
      <header class="column-header">
        <div class="column-title-box">
          <span class="col-status-dot progress" aria-hidden="true"></span>
          <h2>Trabajando</h2>
        </div>
        <span class="column-counter-badge" id="count-in-progress" aria-label="Número de tareas en curso">0</span>
      </header>
      <div class="column-cards-list" role="list"></div>
    </section>

    <!-- Columna 3: Hecho -->
    <section class="kanban-column" id="column-done" data-column="done" aria-label="Columna de tareas completadas">
      <header class="column-header">
        <div class="column-title-box">
          <span class="col-status-dot done" aria-hidden="true"></span>
          <h2>Hecho</h2>
        </div>
        <span class="column-counter-badge" id="count-done" aria-label="Número de tareas completadas">0</span>
      </header>
      <div class="column-cards-list" role="list"></div>
    </section>

  </main>

  <!-- Panel Inferior de Notas Rápidas y Recordatorios (Colapsable) -->
  <section id="kanban-notes-panel" class="kanban-notes-section" aria-label="Panel de notas y recordatorios">
    <header class="notes-header-bar">
      <div class="notes-header-left">
        <h2>Notas Rápidas y Recordatorios</h2>
        <span id="notes-count-badge" class="notes-badge">0 notas</span>
      </div>

      <div class="notes-header-actions">
        <button type="button" class="btn-secondary-action" id="btn-add-note">
          <svg viewBox="0 0 24 24" width="14" height="14" aria-hidden="true">
            <path fill="currentColor" d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/>
          </svg>
          <span>+ Nueva nota</span>
        </button>

        <button
          type="button"
          class="btn-collapse-toggle"
          id="btn-toggle-notes"
          aria-expanded="true"
          aria-controls="notes-grid"
          title="Plegar / Desplegar panel de notas"
        >
          <span class="toggle-icon">▼</span>
        </button>
      </div>
    </header>

    <div class="notes-grid-wrapper">
      <div id="notes-grid" class="notes-grid"></div>
    </div>
  </section>

</div>

<!-- Modal: Añadir o Editar Tarea Personal -->
<div class="modal-backdrop" id="personal-task-modal" role="dialog" aria-modal="true" aria-labelledby="task-modal-heading" aria-hidden="true">
  <div class="modal-dialog">
    <div class="modal-header">
      <h2 class="modal-title" id="task-modal-heading">Nueva Tarea Personal</h2>
      <button type="button" class="modal-close" data-close-modal="personal-task-modal" aria-label="Cerrar diálogo">&times;</button>
    </div>

    <form id="personal-task-form">
      <div class="modal-body">
        <div class="form-group">
          <label for="task-title-input">Título de la tarea *</label>
          <input
            type="text"
            id="task-title-input"
            class="form-input"
            placeholder="Ej: Comprar pendrive USB 3.0 / Practicar modelado"
            required
          />
        </div>

        <div class="form-group">
          <label for="task-mod-select">Módulo / Asignatura (opcional)</label>
          <select id="task-mod-select" class="form-select">
            <option value="">Sin módulo / General</option>
          </select>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label for="task-date-input">Fecha límite (opcional)</label>
            <input type="date" id="task-date-input" class="form-input" />
          </div>
          <div class="form-group">
            <label for="task-time-input">Hora (opcional)</label>
            <input type="time" id="task-time-input" class="form-input" value="23:59" />
          </div>
        </div>

        <div class="form-group">
          <label for="task-notes-input">Observaciones / Detalles</label>
          <textarea
            id="task-notes-input"
            class="form-textarea"
            placeholder="Añade enlaces, requisitos o detalles de la tarea…"
          ></textarea>
        </div>
      </div>

      <div class="modal-actions">
        <button type="button" class="modal-btn" data-close-modal="personal-task-modal">Cancelar</button>
        <button type="submit" class="modal-btn primary">Guardar tarea</button>
      </div>
    </form>
  </div>
</div>

<script type="module" src="src/kanban/kanban.js"></script>
</body>
</html>
