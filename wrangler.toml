name = "h-cfgs-3d"
main = "worker/index.js"
compatibility_date = "2024-04-01"

[assets]
directory = "."

[observability]
enabled = true

[vars]
ENVIRONMENT = "production"
TZ = "Europe/Madrid"

# Almacenamiento distribuido KV para exámenes (/api/events) y vinculación de dispositivos (/api/sync)
# Para crearlo en Cloudflare CLI: npx wrangler kv:namespace create EVENTS_KV
[[kv_namespaces]]
binding = "EVENTS_KV"
id = "REEMPLAZAR_CON_KV_ID"
preview_id = "REEMPLAZAR_CON_KV_PREVIEW_ID"
